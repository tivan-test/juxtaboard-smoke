services:
  tests:
    build: .
    image: juxtaboard-tests
    # Почта, пароль и адрес сайта — из .env рядом с этим файлом (шаблон: .env.example)
    env_file: .env
    # init пересылает Ctrl+C и docker stop скрипту: он успевает удалить пространство прогона
    init: true
    # Chromium нужна общая память больше стандартных 64 МБ
    ipc: host
    volumes:
      # Отчёты и скрины остаются на компьютере после удаления контейнера
      - ./runs:/app/runs
      # Сессия входа переживает перезапуск: сайт ограничивает частые входы
      - ./auth:/app/auth
